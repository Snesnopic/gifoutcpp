name: Round Trip & Robustness Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  round-trip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake build-essential gifsicle imagemagick

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # fixtures cover the structural features the reader has to preserve:
      # single frame, animation, interlacing, transparency, local colormaps,
      # comments and application extensions, tiny palettes
      - name: Generate fixtures
        run: |
          # ubuntu still ships imagemagick 6, which has convert but not magick
          IM=$(command -v magick || command -v convert)
          mkdir -p /tmp/fx
          $IM -size 160x120 gradient:red-blue /tmp/fx/static.gif
          $IM -size 64x64 xc:white -fill black \
              -draw "circle 32,32 32,8" /tmp/fx/shapes.gif
          $IM -delay 10 -size 80x80 xc:red xc:green xc:blue \
              -loop 0 /tmp/fx/anim.gif
          $IM -size 100x100 plasma:fractal -colors 8 /tmp/fx/few_colors.gif
          gifsicle --interlace /tmp/fx/static.gif -o /tmp/fx/interlaced.gif
          gifsicle -O3 /tmp/fx/anim.gif -o /tmp/fx/anim_opt.gif
          gifsicle --comment "gifoutcpp test" /tmp/fx/shapes.gif -o /tmp/fx/commented.gif
          gifsicle --transparent 0 /tmp/fx/few_colors.gif -o /tmp/fx/transparent.gif
          ls -l /tmp/fx

      # an untouched read/write cycle must reproduce the input byte for byte;
      # anything else means the model lost part of the file
      - name: Round trip is byte-identical
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            ./build/gifoutcpp -q --copy "$f" "/tmp/out.gif" || { echo "FAIL read/write $f"; fail=1; continue; }
            if cmp -s "$f" /tmp/out.gif; then
              echo "ok  $(basename "$f")"
            else
              echo "FAIL not byte-identical: $(basename "$f")"
              cmp -l "$f" /tmp/out.gif | head -5
              fail=1
            fi
          done
          exit $fail

      # re-chunking the lzw blocks changes the bytes but must not change the image
      - name: Reblocked output renders identically
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            ./build/gifoutcpp -q --copy --reblock "$f" "/tmp/out.gif" || { echo "FAIL $f"; fail=1; continue; }
            if gifdiff "$f" /tmp/out.gif; then
              echo "ok  $(basename "$f")"
            else
              echo "FAIL renders differently: $(basename "$f")"
              fail=1
            fi
          done
          exit $fail

      # the greedy encoder rewrites every lzw stream, so only the image may survive
      - name: Recompressed output renders identically
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            ./build/gifoutcpp -q "$f" "/tmp/out.gif" || { echo "FAIL $f"; fail=1; continue; }
            if gifdiff "$f" /tmp/out.gif; then
              echo "ok  $(basename "$f") $(stat -c%s "$f") -> $(stat -c%s /tmp/out.gif)"
            else
              echo "FAIL renders differently: $(basename "$f")"
              fail=1
            fi
          done
          exit $fail

      # restructuring may only preserve the animation as played, which is what gifdiff
      # checks; -w lets it ignore frames merged away on purpose
      - name: Optimized output renders identically
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            ./build/gifoutcpp -q -O "$f" "/tmp/out.gif" || { echo "FAIL $f"; fail=1; continue; }
            if gifdiff -w "$f" /tmp/out.gif; then
              echo "ok  $(basename "$f") $(stat -c%s "$f") -> $(stat -c%s /tmp/out.gif)"
            else
              echo "FAIL renders differently: $(basename "$f")"
              fail=1
            fi
          done
          exit $fail

      # the optimizer is allowed to lose on a given file, but the tool must not
      - name: Optimizing never makes a file larger
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            ./build/gifoutcpp -q "$f" /tmp/plain.gif || { echo "FAIL $f"; fail=1; continue; }
            ./build/gifoutcpp -q -O "$f" /tmp/opt.gif || { echo "FAIL $f"; fail=1; continue; }
            plain=$(stat -c%s /tmp/plain.gif); opt=$(stat -c%s /tmp/opt.gif)
            if [ "$opt" -gt "$plain" ]; then
              echo "FAIL $(basename "$f"): -O gave $opt, plain gave $plain"
              fail=1
            fi
          done
          exit $fail

      # parallelism is an optimization, never a different answer
      - name: Threads do not change the output
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            for mode in "-O" "-O -s"; do
              ./build/gifoutcpp -q $mode -j 1 "$f" /tmp/one.gif || { echo "FAIL $f"; fail=1; continue; }
              ./build/gifoutcpp -q $mode -j 0 "$f" /tmp/many.gif || { echo "FAIL $f"; fail=1; continue; }
              if cmp -s /tmp/one.gif /tmp/many.gif; then
                echo "ok  $mode $(basename "$f")"
              else
                echo "FAIL threads changed the output: $mode $(basename "$f")"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Searching renders identically and never loses
        run: |
          fail=0
          for f in /tmp/fx/*.gif; do
            ./build/gifoutcpp -q "$f" /tmp/greedy.gif || { echo "FAIL $f"; fail=1; continue; }
            ./build/gifoutcpp -q -s "$f" /tmp/search.gif || { echo "FAIL $f"; fail=1; continue; }
            gifdiff "$f" /tmp/search.gif || { echo "FAIL renders differently: $f"; fail=1; }
            g=$(stat -c%s /tmp/greedy.gif); s=$(stat -c%s /tmp/search.gif)
            if [ "$s" -gt "$g" ]; then
              echo "FAIL $(basename "$f"): search gave $s, greedy gave $g"
              fail=1
            fi
          done
          exit $fail

      # the library has to be usable from outside: install it, then build a consumer
      # that only knows find_package and the public header
      - name: Install and build an external consumer
        run: |
          cmake --install build --prefix /tmp/prefix
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/main.cpp <<'EOF'
          #include <cstdio>
          #include <gifoutcpp/gifoutcpp.hpp>
          int main(int argc, char** argv) {
              if (argc != 3) return 2;
              gifout::Options options;
              options.restructure = true;
              options.search_restarts = true;
              const auto r = gifout::recompress_file(argv[1], argv[2], options);
              std::printf("%zu -> %zu bytes\n", r.input_bytes, r.output_bytes);
              return r.ok ? 0 : 1;
          }
          EOF
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(gifoutcpp REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE gifoutcpp::core)
          EOF
          cmake -S /tmp/consumer -B /tmp/consumer/build -DCMAKE_PREFIX_PATH=/tmp/prefix
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer /tmp/fx/anim.gif /tmp/consumer_out.gif
          gifdiff -w /tmp/fx/anim.gif /tmp/consumer_out.gif

      - name: Info mode reads every fixture
        run: |
          for f in /tmp/fx/*.gif; do ./build/gifoutcpp --info "$f" > /dev/null || exit 1; done

  robustness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake build-essential imagemagick

      - name: Configure and build with sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build build-asan -j$(nproc)
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"
          cmake --build build-tsan -j$(nproc)

      - name: Unit tests under address and thread sanitizers
        run: |
          ./build-asan/gifout_tests
          ./build-tsan/gifout_tests

      # a parser that meets real files has to survive damaged ones: every prefix of
      # a valid gif, plus byte-level corruption, must not crash or read out of bounds
      - name: Truncated and corrupted inputs
        run: |
          IM=$(command -v magick || command -v convert)
          $IM -delay 10 -size 60x60 xc:red xc:green xc:blue -loop 0 /tmp/anim.gif
          size=$(stat -c%s /tmp/anim.gif)
          for cut in $(seq 1 17 "$size"); do
            head -c "$cut" /tmp/anim.gif > /tmp/trunc.gif
            code=0
            ./build-asan/gifoutcpp --info /tmp/trunc.gif > /dev/null 2>&1 || code=$?
            if [ "$code" -gt 2 ]; then
              echo "FAIL crash on ${cut}-byte prefix (exit $code)"
              exit 1
            fi
          done
          python3 - <<'EOF'
          import random, subprocess, sys
          data = bytearray(open('/tmp/anim.gif','rb').read())
          random.seed(7)
          for i in range(200):
              d = bytearray(data)
              for _ in range(random.randint(1, 8)):
                  d[random.randrange(len(d))] = random.randrange(256)
              open('/tmp/fuzz.gif','wb').write(d)
              p = subprocess.run(['./build-asan/gifoutcpp','-q','-O','/tmp/fuzz.gif','/tmp/fz.gif'],
                                 capture_output=True)
              if p.returncode > 2:
                  sys.stderr.write(f"crash on mutation {i}, exit {p.returncode}\n")
                  sys.stderr.write(p.stderr.decode('utf-8', 'replace')[:4000])
                  sys.exit(1)
          print("200 mutated inputs handled")
          EOF
          IM=$(command -v magick || command -v convert)
          $IM -delay 10 -size 90x90 xc:red xc:blue -loop 0 /tmp/race.gif
          ./build-tsan/gifoutcpp -q -O -s -j 4 /tmp/race.gif /tmp/race_out.gif

  fuzz:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install clang with the fuzzer runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake build-essential clang
          # the fuzzer runtime lives in a versioned package that clang does not always pull
          echo 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long){return 0;}' > /tmp/probe.cpp
          if ! clang++ -fsanitize=fuzzer /tmp/probe.cpp -o /tmp/probe 2>/dev/null; then
            sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
            clang++ -fsanitize=fuzzer /tmp/probe.cpp -o /tmp/probe
          fi

      - name: Build the fuzz targets
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DGIFOUT_BUILD_FUZZERS=ON \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-fuzz -j$(nproc)
        env:
          CC: clang
          CXX: clang++

      # a minute each: this is a regression net, not a fuzzing campaign. a real
      # campaign runs for hours and keeps its corpus between runs.
      - name: Fuzz the encoder round trip
        run: |
          mkdir -p /tmp/rt
          ./build-fuzz/fuzz_roundtrip -max_total_time=60 -max_len=8192 -rss_limit_mb=4096 /tmp/rt

      - name: Fuzz the reader and the pipeline
        run: |
          mkdir -p /tmp/rd
          ./build-fuzz/fuzz_reader -max_total_time=60 -max_len=65536 -rss_limit_mb=4096 \
              /tmp/rd fuzz/seeds

      - name: Upload any crash found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
